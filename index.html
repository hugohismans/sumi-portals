<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- `user-scalable=no` empêche le double-tap de zoomer en plein jeu, et
         `viewport-fit=cover` évite la bande blanche sous les écrans à encoche. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#efe7d6" />
    <title>Lavis</title>
    <style>
      :root {
        --paper: #efe7d6;
        --ink: #1b1714;
        --vermilion: #c8492e;
        --indigo: #2f4b7c;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* `100dvh` suit la barre d'adresse des navigateurs mobiles, qui se replie
         en cours de route ; `100vh` laisserait une bande vide en bas. Le repli
         en `100%` couvre les navigateurs qui l'ignorent encore. */
      html, body {
        width: 100%; height: 100%; height: 100dvh;
        overflow: hidden; background: var(--paper);
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }
      body { font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink); }
      canvas { display: block; }

      #hud {
        position: fixed; inset: 0; pointer-events: none;
        display: flex; flex-direction: column; justify-content: space-between;
      }

      #crosshair {
        position: fixed; left: 50%; top: 50%;
        width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px;
        background: var(--ink); border-radius: 50%; opacity: .5;
      }

      #scale-readout {
        align-self: flex-start;
        margin: 22px;
        padding: 10px 16px 12px;
        background: rgba(239, 231, 214, .72);
        border: 2px solid var(--ink);
        border-radius: 2px;
        box-shadow: 3px 3px 0 rgba(27, 23, 20, .25);
      }
      #scale-readout .label { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; opacity: .6; }
      #scale-readout .value { font-size: 26px; font-weight: 700; line-height: 1.15; }
      #scale-readout .sub { font-size: 11px; opacity: .65; }
      #scale-readout .peers { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(27,23,20,.2); opacity: .5; }
      #scale-readout .peers:empty { display: none; }

      /* --- Le mot, quand il y en a un ------------------------------------ */
      /*
        CE JEU N'EXPLIQUE RIEN, et la bulle disait le contraire : un cadre noir
        de deux pixels sur un fond opaque, c'est-à-dire un élément d'interface
        posé sur le dessin. Elle reste — le moteur du texte est intact et servira
        peut-être — mais elle cesse d'être une boîte.

        Plus de cadre, plus de fond : le mot est écrit À MÊME LE PAPIER, avec un
        halo clair qui le détache de n'importe quel décor. Il se lit sur un mur
        noir comme sur un ciel crème, et il ne ressemble plus à une consigne.

        ET VIDE, IL N'EXISTE PAS. `display: none` sur `:empty`, et `visibility`
        qui bascule APRÈS le fondu — sinon la boîte garde sa place, et sur un
        écran de téléphone on voit un rectangle vide en bas, ce qui est
        exactement ce qu'on ne veut pas.
      */
      #hint {
        align-self: center; margin: 0 0 30px;
        padding: 2px 10px;
        font-size: 13px; letter-spacing: .02em; line-height: 1.4;
        text-align: center; max-width: 30ch;
        color: var(--ink);
        text-shadow:
          0 0 6px var(--paper), 0 0 6px var(--paper),
          0 0 14px var(--paper), 0 1px 2px var(--paper);
        opacity: 0; visibility: hidden;
        transition: opacity .5s ease, visibility 0s linear .5s;
      }
      #hint.show {
        opacity: 1; visibility: visible;
        transition: opacity .5s ease, visibility 0s;
      }
      #hint:empty { display: none; }

      /* --- Les repères de mise au point (?debug=1) ------------------------ */
      /* Volontairement laid et lisible : ce n'est pas le jeu, c'est l'établi. */
      #debug {
        position: fixed; left: 12px; top: 12px; z-index: 8;
        max-width: 340px; max-height: calc(100vh - 24px); overflow-y: auto;
        padding: 10px 12px;
        background: rgba(239, 231, 214, .93);
        border: 2px solid var(--ink); border-radius: 2px;
        font-size: 11px; line-height: 1.45; pointer-events: auto;
      }
      #debug h3 {
        margin: 0 0 6px; font-size: 11px; letter-spacing: .12em;
        text-transform: uppercase; opacity: .55; cursor: pointer;
      }
      /* Replié : il ne reste que le titre. La liste mange la moitié d'un écran
         étroit, et l'on veut pouvoir REGARDER ce qu'on vient de vérifier. */
      #debug.replie button { display: none; }
      #debug button {
        display: block; width: 100%; margin: 0 0 3px; padding: 4px 6px;
        text-align: left; font: inherit; color: inherit; cursor: pointer;
        background: none; border: none; border-left: 3px solid transparent;
      }
      #debug button:hover, #debug button:focus { background: rgba(33, 28, 23, .09); }
      #debug button.ici { border-left-color: var(--ink); background: rgba(33, 28, 23, .07); }
      #debug b { display: block; font-weight: 600; }
      #debug b kbd {
        display: inline-block; min-width: 15px; margin-right: 5px;
        padding: 0 3px; text-align: center;
        border: 1px solid var(--ink); border-radius: 2px; font-size: 10px;
      }
      #debug small { display: block; opacity: .68; padding-left: 20px; }

      /* --- Commandes tactiles ------------------------------------------- */
      /* Rien de tout ça n'existe au clavier : c'est `body.touch` qui l'ouvre. */
      #touch-surface, #touch-buttons { display: none; }

      body.touch #touch-surface {
        display: block; position: fixed; inset: 0;
        touch-action: none; z-index: 5;
      }
      body.touch #touch-buttons {
        display: flex; flex-direction: column; gap: 10px;
        position: fixed; right: 16px; bottom: 22px; z-index: 6;
      }
      body.touch #touch-buttons button {
        min-width: 104px; padding: 15px 18px;
        font: 600 15px/1 "Segoe UI", system-ui, sans-serif;
        color: var(--ink); background: rgba(239, 231, 214, .82);
        border: 2px solid var(--ink); border-radius: 3px;
        box-shadow: 3px 3px 0 rgba(27, 23, 20, .22);
        touch-action: none; -webkit-user-select: none; user-select: none;
      }
      body.touch #touch-buttons button:active {
        transform: translate(3px, 3px); box-shadow: none;
      }
      /* Le réticule ne sert à rien sans souris, et gêne la lecture. */
      body.touch #crosshair { display: none; }

      #overlay {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(239, 231, 214, .93);
        cursor: pointer; z-index: 10;
      }
      #overlay.hidden { display: none; }
      #overlay .card {
        max-width: 460px; padding: 34px 38px;
        border: 3px solid var(--ink); border-radius: 3px;
        background: var(--paper);
        box-shadow: 7px 7px 0 rgba(27, 23, 20, .18);
      }
      /* LE TITRE. Un seul mot, très grand, très espacé — un lavis est un dessin
         à l'encre diluée, et c'est littéralement l'état du monde au début du
         jeu. Le mot dit l'image et la mécanique à la fois ; il n'a besoin
         d'aucun sous-titre pour l'expliquer. */
      #overlay h1 {
        font-size: clamp(46px, 13vw, 76px);
        font-weight: 400;
        letter-spacing: .3em;
        margin: 0 0 4px -.3em;   /* on rattrape l'espacement pour rester centré */
        line-height: 1;
      }
      #overlay .ligne { font-size: 15px; line-height: 1.7; opacity: .78; margin-bottom: 26px; }
      #overlay .go { margin-top: 4px; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; opacity: .62; }
      #overlay .son { margin-top: 16px; font-size: 12px; opacity: .42; }
      /* Une seule fois : à la reprise, le joueur a déjà lu. */
      #overlay.resumed .son { display: none; }

      /* LES CINQ PINCEAUX. Ils sont gris, sauf un — celui qu'on tient déjà.
         C'est toute la partie résumée en une image : il en manque quatre, et
         l'on va les chercher. Ils s'encrent en passant la souris dessus, ce
         qui n'apprend rien mais donne envie, et c'est le rôle d'une couverture. */
      #overlay .pinceaux { display: flex; gap: 16px; justify-content: center; margin: 4px 0 24px; }
      #overlay .pinceaux svg { width: 21px; height: 74px; overflow: visible; }
      #overlay .pinceaux .touffe { fill: #9a948b; transition: fill .55s ease; }
      #overlay .pinceaux svg:hover .touffe,
      #overlay .pinceaux svg.encre .touffe { fill: var(--teinte); }
      #overlay .pinceaux .hampe { fill: #ded3bb; }
      #overlay .pinceaux .virole { fill: #b08a48; }
      #overlay .pinceaux .trait { stroke: var(--ink); stroke-width: 1.4; fill: none; }

      @media (prefers-reduced-motion: reduce) {
        #overlay .pinceaux .touffe { transition: none; }
      }

      /* Après la première entrée, le panneau se fait discret : il ne sert plus
         qu'à reprendre la souris, pas à réexpliquer la règle. */
      #overlay.resumed .lede { display: none; }
      #overlay .go .resume { display: none; }
      #overlay.resumed .go .enter { display: none; }
      #overlay.resumed .go .resume { display: inline; }

      /* LE CARTON DE FIN — voir le commentaire du bloc, plus bas. */
      #fin {
        position: fixed; inset: 0; z-index: 8;
        display: flex; align-items: center; justify-content: center;
        pointer-events: none;
        opacity: 0; transition: opacity 2.6s ease;
        /* Un voile de papier très léger : le monde reste visible dessous, il
           s'apaise seulement. Un fondu au noir aurait effacé ce qu'on montre. */
        background: radial-gradient(ellipse at center, rgba(239,231,214,0) 30%, rgba(239,231,214,.55) 100%);
      }
      #fin.show { opacity: 1; }
      #fin .mot { text-align: center; }
      #fin h2 {
        font-size: clamp(44px, 12vw, 82px);
        font-weight: 400; letter-spacing: .3em;
        margin: 0 0 .4em -.3em; line-height: 1;
        color: var(--ink);
      }
      #fin p { font-size: 15px; letter-spacing: .05em; opacity: .7; }

      @media (prefers-reduced-motion: reduce) {
        #fin { transition: none; }
      }

      #win {
        position: fixed; inset: 0; z-index: 9;
        display: none; align-items: center; justify-content: center;
        background: rgba(239, 231, 214, .82);
      }
      #win.show { display: flex; }
      #win .card {
        padding: 30px 46px; text-align: center;
        border: 3px solid var(--vermilion); background: var(--paper);
        box-shadow: 7px 7px 0 rgba(200, 73, 46, .2);
      }
      #win h2 { font-size: 30px; color: var(--vermilion); margin-bottom: 8px; }
      #win p { font-size: 13px; opacity: .7; }
    </style>
  </head>
  <body>
    <div id="crosshair"></div>

    <!-- Commandes tactiles. Masquées tant qu'on joue au clavier. -->
    <div id="touch-surface"></div>
    <div id="touch-buttons">
      <button id="btn-take" type="button">Prendre</button>
      <button id="btn-throw" type="button">Lancer</button>
      <button id="btn-jump" type="button">Sauter</button>
    </div>

    <div id="hud">
      <div id="scale-readout">
        <div class="label">Échelle</div>
        <div class="value" id="scale-value">×1</div>
        <div class="sub" id="scale-sub">taille normale</div>
        <div class="sub peers" id="peers"></div>
        <div class="sub peers" id="fps"></div>
      </div>
      <div id="hint"></div>
      <!--
        La liste des repères de mise au point. Vide et masquée sauf en ?debug=1,
        où src/main.ts la remplit depuis src/debug/reperes.ts.
      -->
      <div id="debug" hidden></div>
    </div>

    <div id="win">
      <div class="card">
        <h2>Résolu</h2>
        <p><kbd>R</kbd> pour recommencer · <a href="./" id="suite">niveau suivant</a></p>
      </div>
    </div>

    <!-- LE CARTON DE FIN. Il n'apparaît qu'une fois, à la toute fin du plan de
         recul, quand le monde repeint est entier sous les yeux du joueur. Le
         titre arrive APRÈS ce qu'il nomme : on a d'abord vu, ensuite on lit. -->
    <div id="fin">
      <div class="mot">
        <h2>Lavis</h2>
        <p>Le monde a retrouvé ses couleurs.</p>
      </div>
    </div>

    <div id="overlay">
      <div class="card">
        <h1>Lavis</h1>

        <div class="pinceaux" id="pinceaux">
          <svg data-pigment="vert" viewBox="0 0 20 70" style="--teinte: #4c7a3f" aria-hidden="true">
            <rect class="hampe trait" x="6.5" y="2" width="7" height="40" rx="1.4" />
            <rect class="virole trait" x="5.4" y="40" width="9.2" height="7" rx="1" />
            <path class="touffe encre" d="M5.6 46 h8.8 l-1.5 12 q-.4 6 -2.9 10 q-2.5 -4 -2.9 -10 z" />
            <path class="trait" d="M5.6 46 h8.8 l-1.5 12 q-.4 6 -2.9 10 q-2.5 -4 -2.9 -10 z" />
          </svg>
          <svg data-pigment="rouge" viewBox="0 0 20 70" style="--teinte: #c8492e" aria-hidden="true">
            <rect class="hampe trait" x="6.5" y="2" width="7" height="40" rx="1.4" />
            <rect class="virole trait" x="5.4" y="40" width="9.2" height="7" rx="1" />
            <path class="touffe" d="M5.6 46 h8.8 l-1.5 12 q-.4 6 -2.9 10 q-2.5 -4 -2.9 -10 z" />
            <path class="trait" d="M5.6 46 h8.8 l-1.5 12 q-.4 6 -2.9 10 q-2.5 -4 -2.9 -10 z" />
          </svg>
          <svg viewBox="0 0 20 70" style="--teinte: #c8a02e" aria-hidden="true">
            <rect class="hampe trait" x="6.5" y="2" width="7" height="40" rx="1.4" />
            <rect class="virole trait" x="5.4" y="40" width="9.2" height="7" rx="1" />
            <path class="touffe" d="M5.6 46 h8.8 l-1.5 12 q-.4 6 -2.9 10 q-2.5 -4 -2.9 -10 z" />
            <path class="trait" d="M5.6 46 h8.8 l-1.5 12 q-.4 6 -2.9 10 q-2.5 -4 -2.9 -10 z" />
          </svg>
          <svg viewBox="0 0 20 70" style="--teinte: #2f4b7c" aria-hidden="true">
            <rect class="hampe trait" x="6.5" y="2" width="7" height="40" rx="1.4" />
            <rect class="virole trait" x="5.4" y="40" width="9.2" height="7" rx="1" />
            <path class="touffe" d="M5.6 46 h8.8 l-1.5 12 q-.4 6 -2.9 10 q-2.5 -4 -2.9 -10 z" />
            <path class="trait" d="M5.6 46 h8.8 l-1.5 12 q-.4 6 -2.9 10 q-2.5 -4 -2.9 -10 z" />
          </svg>
          <svg viewBox="0 0 20 70" style="--teinte: #7a4c8a" aria-hidden="true">
            <rect class="hampe trait" x="6.5" y="2" width="7" height="40" rx="1.4" />
            <rect class="virole trait" x="5.4" y="40" width="9.2" height="7" rx="1" />
            <path class="touffe" d="M5.6 46 h8.8 l-1.5 12 q-.4 6 -2.9 10 q-2.5 -4 -2.9 -10 z" />
            <path class="trait" d="M5.6 46 h8.8 l-1.5 12 q-.4 6 -2.9 10 q-2.5 -4 -2.9 -10 z" />
          </svg>
        </div>

        <p class="ligne lede">
          Un monde dessiné à l’encre, et qui a perdu ses couleurs.<br />
          Elles sont quelque part.
        </p>

        <div class="go">
          <span class="enter">Tremper le pinceau</span>
          <span class="resume">Reprendre le trait</span>
        </div>

        <!--
          LE SON EXISTE, ET PERSONNE NE LE SAIT.
          Signalé après une partie sur téléphone : aucun son, et l'appareil était
          en silencieux. Sur mobile, le petit interrupteur latéral coupe le son
          d'une page web sans qu'aucun réglage du jeu n'y puisse rien — donc ce
          n'est pas un défaut à corriger, c'est une chose à DIRE.
          Une ligne discrète, sous l'appel, et une seule fois : au premier
          lancement. Rappeler le son à chaque reprise serait un nag.
        -->
        <p class="ligne son">Il y a du son. Coupe le silencieux, ou mets un casque.</p>

      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
